services:
  neon-init:
    image: postgres:16-alpine
    container_name: blog-neon-init
    restart: "no"
    env_file:
      - ../.env
    volumes:
      - ./db/init.sql:/init.sql:ro
    command: >
      sh -c "psql \"$$DATABASE_URL\" -v ON_ERROR_STOP=1 -f /init.sql"

  backend:
    build:
      # Contexto na raiz: e o que permite ao Dockerfile copiar o `.env` da raiz.
      context: ..
      dockerfile: blog-educacional/backend/Dockerfile
    container_name: blog-backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: development
      PORT: 3001
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      neon-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        # URL usada pelo NAVEGADOR, embutida no bundle em tempo de build — por
        # isso vem como arg. `http://backend:3001` aqui quebraria o cliente.
        NEXT_PUBLIC_API_URL: http://localhost:3001
    container_name: blog-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_URL: http://backend:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend
